name: Windows release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4

    - name: Install Qt 6.8
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.3'
        host: windows
        target: desktop
        arch: win64_msvc2022_64
        archives: qtbase qtsvg qttools
        cache: true

    - name: Configure
      shell: pwsh
      run: cmake -S . -B build -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

    - name: Build
      run: cmake --build build --config Release --parallel

    - name: Package
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $built = Join-Path $env:GITHUB_WORKSPACE 'build\bin\Release'
        $pack = Join-Path $env:GITHUB_WORKSPACE 'RpcView-Portable'
        New-Item -ItemType Directory -Force -Path $pack | Out-Null
        Copy-Item (Join-Path $built '*.exe') $pack
        Copy-Item (Join-Path $built '*.dll') $pack
        $deploy = Join-Path $env:QT_ROOT_DIR 'bin\windeployqt.exe'
        & $deploy --release --no-translations (Join-Path $pack 'RpcView.exe')
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        $msvc = Get-ChildItem (Join-Path $vs 'VC\Redist\MSVC') -Directory | Sort-Object Name -Descending | Select-Object -First 1
        $crt = Get-ChildItem (Join-Path $msvc.FullName 'x64') -Directory -Filter 'Microsoft.VC*.CRT' | Select-Object -First 1
        if (-not $crt) { throw "VC runtime redist was not found" }
        Copy-Item (Join-Path $crt.FullName '*.dll') $pack
        Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'redist\x64\*.dll') $pack -Force
        @(
          'RpcView x64.'
          'Run RpcView.exe as administrator.'
          'The default symbol path is srv*C:\Symbols*https://msdl.microsoft.com/download/symbols.'
        ) | Set-Content -Path (Join-Path $pack 'README.txt') -Encoding ascii
        $zip = Join-Path $env:GITHUB_WORKSPACE 'RpcView-Portable.zip'
        tar.exe -a -c -f $zip -C $pack .

    - name: Upload workflow artifact
      uses: actions/upload-artifact@v4
      with:
        name: RpcView-Portable
        path: RpcView-Portable.zip

    - name: Publish GitHub release
      if: github.ref == 'refs/heads/master'
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $false
        $notes = @(
          'Windows x64 build of this fork.'
          'Unzip the folder and run RpcView.exe as administrator.'
          'The default symbol path is srv*C:\Symbols*https://msdl.microsoft.com/download/symbols.'
          'Download PDBs is on the menu bar, between Filter and Help.'
        ) -join "`n"
        gh release view windows-x64 --json tagName | Out-Null
        if ($LASTEXITCODE -eq 0) {
          gh release upload windows-x64 RpcView-Portable.zip --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        } else {
          gh release create windows-x64 RpcView-Portable.zip --title "Windows x64" --notes $notes --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
