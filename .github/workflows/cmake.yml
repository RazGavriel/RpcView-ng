name: Windows release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4

    - name: Install Qt 6.8
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.3'
        host: windows
        target: desktop
        arch: win64_msvc2022_64
        archives: qtbase qtsvg qttools
        cache: true

    - name: Configure
      shell: pwsh
      run: cmake -S . -B build -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

    - name: Build
      run: cmake --build build --config Release --parallel

    - name: Package
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $built = Join-Path $env:GITHUB_WORKSPACE 'build\bin\Release'
        $pack = Join-Path $env:GITHUB_WORKSPACE 'RpcView-Portable'
        New-Item -ItemType Directory -Force -Path $pack | Out-Null
        Copy-Item (Join-Path $built '*.exe') $pack
        Copy-Item (Join-Path $built '*.dll') $pack
        $deploy = Join-Path $env:QT_ROOT_DIR 'bin\windeployqt.exe'
        & $deploy --release --compiler-runtime --no-translations (Join-Path $pack 'RpcView.exe')
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $kit = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Directory |
          Where-Object { $_.Name -match '^\d' } |
          Sort-Object Name -Descending |
          Select-Object -First 1
        foreach ($name in 'dbghelp.dll','symsrv.dll','dbgcore.dll') {
          $src = Join-Path $kit.FullName "x64\$name"
          if (-not (Test-Path -LiteralPath $src)) { throw "Missing $src" }
          Copy-Item -LiteralPath $src -Destination $pack -Force
        }
        @(
          'RpcView x64.'
          'Run RpcView.exe as administrator.'
          'The default symbol path is srv*C:\Symbols*https://msdl.microsoft.com/download/symbols.'
        ) | Set-Content -Path (Join-Path $pack 'README.txt') -Encoding ascii
        $zip = Join-Path $env:GITHUB_WORKSPACE 'RpcView-Portable.zip'
        tar.exe -a -c -f $zip -C $pack .

    - name: Upload workflow artifact
      uses: actions/upload-artifact@v4
      with:
        name: RpcView-Portable
        path: RpcView-Portable.zip

    - name: Publish GitHub release
      if: github.ref == 'refs/heads/master'
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $false
        $notes = @(
          'Windows x64 build of this fork.'
          'Unzip the folder and run RpcView.exe as administrator.'
          'The default symbol path is srv*C:\Symbols*https://msdl.microsoft.com/download/symbols.'
          'Download PDBs is on the menu bar, between Filter and Help.'
        ) -join "`n"
        gh release view windows-x64 --json tagName | Out-Null
        if ($LASTEXITCODE -eq 0) {
          gh release upload windows-x64 RpcView-Portable.zip --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        } else {
          gh release create windows-x64 RpcView-Portable.zip --title "Windows x64" --notes $notes --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
